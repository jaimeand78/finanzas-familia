<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organiza2 — Finanzas</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <!-- PANTALLA DE LOGIN -->
  <div id="loginScreen">
    <div class="login-card">
      <div class="login-logo">🏠</div>
      <h1>Organiza2</h1>
      <p>Organizamos tu vida en pareja.</p>
      <button class="btn-google" onclick="loginWithGoogle()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
             alt="Google" width="20">
        Entrar con Google
      </button>
      <p id="loginError" class="login-error" style="display:none"></p>
    </div>
  </div>

  <!-- APP SHELL (oculto hasta autenticación) -->
  <div id="appShell" style="display:none">
    <div class="topbar">
      <span class="app-title">Organiza2</span>
      <div class="topbar-right">
        <span id="uChip" class="chip" style="display:none"></span>
        <button onclick="signOutUser()" class="btn-logout">Salir</button>
      </div>
    </div>
    <div id="mainContent" style="padding:2rem;text-align:center;color:#666;">
      ✅ Login exitoso. Construyendo Finanzas v2...
    </div>
  </div>

  <!-- ONBOARDING HOGAR (se muestra sobre appShell si no tiene hogar) -->
  <div id="hogarScreen" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200; align-items:center; justify-content:center; padding:1rem;">
    <div class="login-card" style="text-align:left; gap:.75rem;">

      <!-- Paso 1: Decisión -->
      <div id="paso-decision">
        <div class="login-logo" style="text-align:center;">🏠</div>
        <h2 style="text-align:center; font-size:1.2rem;">Bienvenido</h2>
        <p style="text-align:center; color:var(--color-muted); font-size:.9rem;">¿Cómo quieres empezar?</p>
        <div style="display:flex; flex-direction:column; gap:.6rem; margin-top:.5rem;">
          <button class="btn-google" onclick="onbCrear()" style="background:var(--color-primary); color:#fff; border:none; font-weight:600;">Crear mi hogar</button>
          <button class="btn-google" onclick="onbUnirse()">Tengo un código</button>
        </div>
      </div>

      <!-- Paso 2: Crear hogar -->
      <div id="paso-crear" style="display:none;">
        <h2 style="font-size:1.2rem; margin-bottom:1rem;">Crear hogar</h2>
        <label style="font-size:.85rem; font-weight:600; display:block; margin-bottom:.4rem;">Nombre del hogar</label>
        <input id="ob-nombre" type="text" placeholder="Ej: Hogar Ibarra"
          style="width:100%; padding:.7rem; border:1.5px solid var(--color-border); border-radius:8px; font-size:1rem; font-family:var(--font); margin-bottom:1rem; outline:none;"
          onkeydown="if(event.key==='Enter') onbSubmitCrear()"/>
        <label style="font-size:.85rem; font-weight:600; display:block; margin-bottom:.5rem;">Tipo de hogar</label>
        <div style="display:flex; flex-direction:column; gap:.5rem; margin-bottom:1rem;">
          <label style="display:flex; align-items:center; gap:.6rem; font-size:.95rem; cursor:pointer;"><input type="radio" name="ob-tipo" value="soltero"> Soltero</label>
          <label style="display:flex; align-items:center; gap:.6rem; font-size:.95rem; cursor:pointer;"><input type="radio" name="ob-tipo" value="pareja"> Pareja</label>
          <label style="display:flex; align-items:center; gap:.6rem; font-size:.95rem; cursor:pointer;"><input type="radio" name="ob-tipo" value="familia"> Familia</label>
        </div>
        <p id="ob-error-crear" style="display:none; color:var(--color-error); font-size:.85rem; margin-bottom:.5rem;"></p>
        <button id="btn-crear-hogar" class="btn-google" onclick="onbSubmitCrear()" style="background:var(--color-primary); color:#fff; border:none; font-weight:600; width:100%;">Crear hogar</button>
        <button onclick="mostrarPaso('paso-decision')" style="background:none; border:none; color:var(--color-muted); font-size:.9rem; margin-top:.5rem; padding:.4rem 0; width:100%;">← Volver</button>
      </div>

      <!-- Paso 3: Unirse a hogar -->
      <div id="paso-unirse" style="display:none;">
        <h2 style="font-size:1.2rem; margin-bottom:1rem;">Unirse a un hogar</h2>
        <label style="font-size:.85rem; font-weight:600; display:block; margin-bottom:.4rem;">Código del hogar</label>
        <input id="ob-codigo" type="text" placeholder="Ej: K8M4XQ" maxlength="6"
          style="width:100%; padding:.7rem; border:1.5px solid var(--color-border); border-radius:8px; font-size:1.5rem; font-family:monospace; letter-spacing:.2em; text-align:center; text-transform:uppercase; margin-bottom:1rem; outline:none;"
          oninput="this.value=this.value.toUpperCase()"
          onkeydown="if(event.key==='Enter') onbSubmitUnirse()"/>
        <p id="ob-error-unirse" style="display:none; color:var(--color-error); font-size:.85rem; margin-bottom:.5rem;"></p>
        <button id="btn-unirse-hogar" class="btn-google" onclick="onbSubmitUnirse()" style="background:var(--color-primary); color:#fff; border:none; font-weight:600; width:100%;">Unirme</button>
        <button onclick="mostrarPaso('paso-decision')" style="background:none; border:none; color:var(--color-muted); font-size:.9rem; margin-top:.5rem; padding:.4rem 0; width:100%;">← Volver</button>
      </div>

      <!-- Paso 4: Confirmación -->
      <div id="paso-confirmacion" style="display:none; text-align:center;">
        <div style="font-size:2.5rem; margin-bottom:.5rem;">🎉</div>
        <h2 style="font-size:1.1rem;">¡Hogar <span id="conf-nombre"></span> creado!</h2>
        <p style="color:var(--color-muted); font-size:.9rem; margin:.5rem 0;">Comparte este código con tu pareja:</p>
        <div id="conf-codigo" onclick="onbCopiarCodigo()"
          style="font-size:2rem; font-weight:700; font-family:monospace; letter-spacing:.2em; color:var(--color-primary); background:#E8F5EF; border-radius:10px; padding:1rem; margin:.75rem 0; cursor:pointer;"
          title="Toca para copiar"></div>
        <p style="font-size:.75rem; color:var(--color-muted); margin-bottom:.75rem;">Toca el código para copiarlo</p>
        <button class="btn-google" onclick="onbConfirmado()" style="background:var(--color-primary); color:#fff; border:none; font-weight:600; width:100%;">Entrar a Organiza2 →</button>
      </div>

    </div>
  </div>

  <!-- Firebase SDK compat v9 -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <!-- Módulos propios — orden estricto -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/hogar.js"></script>
  <script src="js/firebase-paths.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
