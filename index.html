<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organiza2 — Finanzas</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <!-- PANTALLA DE LOGIN -->
  <div id="loginScreen">
    <div class="login-card">
      <div class="login-logo">🏠</div>
      <h1>Organiza2</h1>
      <p>Organizamos tu vida en pareja.</p>
      <button class="btn-google" onclick="loginWithGoogle()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
             alt="Google" width="20">
        Entrar con Google
      </button>
      <p id="loginError" class="login-error" style="display:none"></p>
    </div>
  </div>

  <!-- APP SHELL (oculto hasta autenticación) -->
  <div id="appShell" style="display:none">
    <div class="topbar">
      <span class="app-title">Organiza2</span>
      <div class="topbar-right">
        <span id="uChip" class="chip" style="display:none"></span>
        <button onclick="signOutUser()" class="btn-logout">Salir</button>
      </div>
    </div>
    <div id="mainContent" style="padding:2rem;text-align:center;color:#666;">
      ✅ Login exitoso. Construyendo Finanzas v2...
    </div>
  </div>

  <!-- Firebase SDK compat v9 -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <!-- Módulos propios — orden estricto -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
